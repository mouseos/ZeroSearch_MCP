[package]
name = "bilibili-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bilibili (Android app protocol) search/detail provider: gRPC polymer SearchAll + viewunite View/RelatesFeed, app-generated buvid, guest (no login). Imported as `bilibili_provider`."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
bytes = "1"
# HTTP/2 through the library's shared reqwest/rustls stack (one client,
# pooled connections); http-body-util collects the body with trailers.
reqwest = { workspace = true }
zs_tls = { workspace = true }
http-body-util = "0.1"
prost = "0.13"
md5 = "0.7"

[[example]]
name = "live_check"
path = "examples/live_check.rs"
