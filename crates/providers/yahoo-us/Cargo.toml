[package]
name = "yahoo-us-mcp-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Yahoo (US) search client library (web, video, news, suggestions) — no API key or login required. Imported as `yahoo_us_search`; also powers the Yahoo_US_MCP server."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[lib]
name = "yahoo_us_search"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
scraper = "0.22"
