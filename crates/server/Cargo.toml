[package]
name = "zero-search-mcp-server"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "ZeroSearch MCP server — Baidu, Yahoo! JAPAN, Bing, Naver, Yahoo (US), Yandex, AliExpress, Goofish, Mercari, Yahoo Auctions, Yahoo Flea Market, Rakuma, Rakuten, Qoo10, Yahoo Shopping and Amazon behind one stdio MCP server. No API key, no configuration."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[[bin]]
name = "zero-search-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Used directly in the per-engine tools modules to classify provider
# errors into the unified `{kind, message}` error form.
reqwest = { workspace = true }

baidu-mcp-provider = { path = "../providers/baidu" }
yahoo-search-mcp-provider = { path = "../providers/yahoo" }
bing-mcp-provider = { path = "../providers/bing" }
naver-mcp-provider = { path = "../providers/naver" }
yahoo-us-mcp-provider = { path = "../providers/yahoo-us" }
yandex-mcp-provider = { path = "../providers/yandex" }
shopping-mcp-aliexpress = { path = "../providers/aliexpress" }
shopping-mcp-goofish = { path = "../providers/goofish" }
shopping-mcp-mercari = { path = "../providers/mercari" }
shopping-mcp-rakuma = { path = "../providers/rakuma" }
shopping-mcp-yahoo-auctions = { path = "../providers/yahoo-auctions" }
shopping-mcp-yahoo-flea = { path = "../providers/yahoo-flea" }
shopping-mcp-rakuten = { path = "../providers/rakuten" }
shopping-mcp-qoo10 = { path = "../providers/qoo10" }
shopping-mcp-yahoo-shopping = { path = "../providers/yahoo-shopping" }
shopping-mcp-amazon = { path = "../providers/amazon" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
