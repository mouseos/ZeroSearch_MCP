name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            server_bin: zero-search-mcp.exe
            launcher_bin: zero-search-mcp-launcher.exe
            helper_bin: zero-search-yahoo-us-image-helper.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            server_bin: zero-search-mcp
            launcher_bin: zero-search-mcp-launcher
            helper_bin: zero-search-yahoo-us-image-helper
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            server_bin: zero-search-mcp
            launcher_bin: zero-search-mcp-launcher
            helper_bin: zero-search-yahoo-us-image-helper

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev \
            libclang-dev cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      # The image helper is a standalone crate outside the workspace
      # (BoringSSL isolation); build it separately into its own
      # target directory.
      - name: Build image helper binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path crates/helpers/yahoo-us-image/Cargo.toml

      # Goofish signing payload: a pinned Java 8 runtime plus the
      # compiled unidbg signing harness, shipped next to the server
      # binary. The Goofish app package itself is not redistributable
      # and is NOT in the payload — the server downloads it on first
      # Goofish use and assembles the runtime in its data directory
      # (see runtime/goofish/build-payload.sh).
      - name: Set up JDK 8 for the Goofish payload build
        uses: actions/setup-java@v4
        with:
          # Zulu: Temurin's setup-java catalog no longer offers a
          # macOS arm64 JDK 8 (the v0.4.0 release run failed there
          # with "Could not find satisfied version for SemVer '8'").
          # Zulu 8 exists for all three runner platforms and is
          # already the payload's macOS JRE source.
          distribution: zulu
          java-version: '8'

      - name: Build Goofish signing payload
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            linux-x64) PAYLOAD_PLATFORM=linux-x64 ;;
            win32-x64) PAYLOAD_PLATFORM=win32-x64 ;;
            macos-arm64) PAYLOAD_PLATFORM=macos-arm64 ;;
            *) echo "no Goofish payload platform mapping for ${{ matrix.platform }}-${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ./runtime/goofish/build-payload.sh "$PAYLOAD_PLATFORM"

      - name: Package installer and MCPB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BUNDLE="ZeroSearch_MCP-${TAG}-${{ matrix.platform }}-${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.target }}/release"
          HELPER_DIR="crates/helpers/yahoo-us-image/target/${{ matrix.target }}/release"

          # sha256sum is absent on macOS runners.
          if command -v sha256sum >/dev/null 2>&1; then
            SHA="sha256sum"
          else
            SHA="shasum -a 256"
          fi

          mkdir -p dist

          PAYLOAD_PLATFORM="${{ matrix.platform }}-${{ matrix.arch }}"
          GOOFISH_PAYLOAD="runtime/goofish/payload-dist/${PAYLOAD_PLATFORM}/goofish-payload"

          # ── Installer package (server + launcher + image helper) ──
          INSTALLER_DIR="dist/${BUNDLE}"
          mkdir -p "${INSTALLER_DIR}"
          cp "${RELEASE_DIR}/${{ matrix.server_bin }}" "${INSTALLER_DIR}/"
          cp "${RELEASE_DIR}/${{ matrix.launcher_bin }}" "${INSTALLER_DIR}/"
          cp "${HELPER_DIR}/${{ matrix.helper_bin }}" "${INSTALLER_DIR}/"
          cp -r "${GOOFISH_PAYLOAD}" "${INSTALLER_DIR}/"
          cp README.md README.en.md LICENSE "${INSTALLER_DIR}/"

          cd dist
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "${BUNDLE}.zip" "${BUNDLE}/"
          else
            zip -r9 "${BUNDLE}.zip" "${BUNDLE}/"
          fi
          cd ..

          # ── MCPB bundle (server + image helper, for the MCP Registry) ──
          MCPB_NAME="zero-search-mcp-${TAG}-${{ matrix.platform }}-${{ matrix.arch }}"
          MCPB_STAGE="dist/${MCPB_NAME}-stage"
          mkdir -p "${MCPB_STAGE}/server"
          cp "${RELEASE_DIR}/${{ matrix.server_bin }}" "${MCPB_STAGE}/server/"
          cp "${HELPER_DIR}/${{ matrix.helper_bin }}" "${MCPB_STAGE}/server/"
          cp -r "${GOOFISH_PAYLOAD}" "${MCPB_STAGE}/server/"

          # The committed manifest.json is generated from the server's
          # tools/list (scripts/generate-manifest.py); only the version
          # and the platform-specific entry point / command are patched
          # here. The version substitution is line-anchored and matches
          # any current value, so it cannot silently stop applying.
          sed -E \
              -e "s/^([[:space:]]*)\"version\": \"[^\"]*\"/\1\"version\": \"${VERSION}\"/" \
              -e "s|\"entry_point\": \"server/zero-search-mcp\"|\"entry_point\": \"server/${{ matrix.server_bin }}\"|" \
              -e "s|\"command\": \"server/zero-search-mcp\"|\"command\": \"server/${{ matrix.server_bin }}\"|" \
              manifest.json > "${MCPB_STAGE}/manifest.json"

          cd "${MCPB_STAGE}"
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "../${MCPB_NAME}.mcpb" .
          else
            zip -r9 "../${MCPB_NAME}.mcpb" .
          fi
          cd ../..

          # ── Wrap the MCPB in a zip for stores that reject unknown extensions ──
          cd dist
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "${MCPB_NAME}.mcpb.zip" "${MCPB_NAME}.mcpb"
          else
            zip -9 "${MCPB_NAME}.mcpb.zip" "${MCPB_NAME}.mcpb"
          fi

          # ── Checksums ──
          ${SHA} "${BUNDLE}.zip" "${MCPB_NAME}.mcpb" "${MCPB_NAME}.mcpb.zip" \
            > "checksums-${{ matrix.platform }}.txt"
          cat "checksums-${{ matrix.platform }}.txt"
          cd ..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## ZeroSearch MCP ${{ github.ref_name }}

            APIキー不要・設定不要。ダウンロードして起動するだけで使えます。
            No API key, no login, no configuration — download and run.

            ### Install

            1. Download the ZIP for your platform and extract it
            2. Run the launcher (`zero-search-mcp-launcher`) and click Install for your agent
            3. Or run `zero-search-mcp setup` in a terminal for copy-paste config

            | Platform | Installer | MCPB (MCP Registry) |
            |----------|-----------|---------------------|
            | Windows x64 | `ZeroSearch_MCP-${{ github.ref_name }}-win32-x64.zip` | `zero-search-mcp-${{ github.ref_name }}-win32-x64.mcpb` |
            | macOS ARM64 | `ZeroSearch_MCP-${{ github.ref_name }}-macos-arm64.zip` | `zero-search-mcp-${{ github.ref_name }}-macos-arm64.mcpb` |
            | Linux x64 | `ZeroSearch_MCP-${{ github.ref_name }}-linux-x64.zip` | `zero-search-mcp-${{ github.ref_name }}-linux-x64.mcpb` |
          files: |
            dist/*.zip
            dist/*.mcpb
            dist/*.mcpb.zip
            dist/checksums-*.txt
